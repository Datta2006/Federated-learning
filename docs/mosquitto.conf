# Mosquitto broker configuration for the federated PM2.5 project.
# Run from the project root:
#   mkdir -p /tmp/fedpm25-mosquitto
#   mosquitto -c docs/mosquitto.conf -v
#
# Profile A (DEFAULT, development): loopback only, anonymous clients.
# Profile B (LAN, commented out): 0.0.0.0, password file + ACL for phones.
# Profile C (LAN DEMO ONLY, commented out): 0.0.0.0, anonymous, no ACL.
#
# Do not expose Profile A or Profile C to the internet or to an untrusted
# Wi-Fi network.

# ===========================================================================
# Profile A: local development (DEFAULT)
# ===========================================================================
# Open to any process on this laptop only. Use this while developing the
# server, virtual nodes, and dashboard.
listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location /tmp/fedpm25-mosquitto/
autosave_interval 30
log_dest stdout
log_type notice
log_type error
log_type warning
connection_messages true

# ===========================================================================
# Profile B: LAN (COMMENTED OUT)
# ===========================================================================
# Phones running Termux and virtual nodes on other hosts connect over Wi-Fi.
#
# To switch from Profile A to Profile B:
#   1. Comment out the two Profile A lines:
#        # listener 1883 127.0.0.1
#        # allow_anonymous true
#   2. Uncomment the Profile B block below.
#   3. Create the password file and ACL (commands after the block).
#   4. Find the laptop's LAN IP and pass it to the node/server:
#        ipconfig getifaddr en0
#        python -m node.node_client --node-id node1 --host 192.168.1.50 ...
#
# The broker binds to every interface; the password file and ACL are what
# prevent an arbitrary Wi-Fi client from reading or forging federated data.
#
# listener 1883 0.0.0.0
# allow_anonymous false
# password_file /tmp/fedpm25-mosquitto/passwd
# acl_file /tmp/fedpm25-mosquitto/acl
#
# Keep persistence and logging from Profile A. Do not enable per_listener_settings
# unless you intentionally keep both listeners alive with different auth rules.

# ---------------------------------------------------------------------------
# Exact commands: password file
# ---------------------------------------------------------------------------
# Run these on the laptop. Use strong, different passwords. The file is
# hashed by mosquitto_passwd; never commit it to git.
#
#   mkdir -p /tmp/fedpm25-mosquitto
#   mosquitto_passwd -c -b /tmp/fedpm25-mosquitto/passwd flserver '<server-password>'
#   mosquitto_passwd -b /tmp/fedpm25-mosquitto/passwd node1 '<node1-password>'
#   mosquitto_passwd -b /tmp/fedpm25-mosquitto/passwd node2 '<node2-password>'
#   mosquitto_passwd -b /tmp/fedpm25-mosquitto/passwd node3 '<node3-password>'
#   mosquitto_passwd -b /tmp/fedpm25-mosquitto/passwd node4 '<node4-password>'
#   mosquitto_passwd -b /tmp/fedpm25-mosquitto/passwd node5 '<node5-password>'
#   chmod 600 /tmp/fedpm25-mosquitto/passwd
#
# On this machine mosquitto_passwd is NOT installed by the source build.
# Build it from the Mosquitto source tree and put it on PATH before running
# the password commands above.

# ---------------------------------------------------------------------------
# Exact commands: ACL file
# ---------------------------------------------------------------------------
# docs/acl.example is the copy-pasteable ACL. Each node may PUBLISH only
# under its own aq/<node_id>/# tree and READ the federated global tree
# aq/fl/#. The server may read/write everything.
#
#   cp docs/acl.example /tmp/fedpm25-mosquitto/acl
#   chmod 600 /tmp/fedpm25-mosquitto/acl
#
# STAGE 3 UPDATE TOPICS:
# Stage 3 training nodes publish their update under
#   aq/fl/round/{r}/update/{node}/...
# which is outside aq/<node_id>/#. docs/acl.example includes the required
# write line under node1..node4:
#
#   topic write aq/fl/round/+/update/node1/#
#
# node5 is the inference-only phone, so it deliberately has no update-write
# line. topic read aq/fl/# already covers the round ack and global announce.
# The cmd/alerts read lines stay commented until those stages land.
# The server already has readwrite #, so it needs no extra line.

# ===========================================================================
# Profile C: private hotspot / trusted Wi-Fi DEMO ONLY (COMMENTED OUT)
# ===========================================================================
# The fastest way to connect phones and virtual nodes in a classroom demo.
# It has NO password file and NO ACL, so every device on the network can read
# and forge federated traffic. Use it only on a private hotspot or a Wi-Fi
# network you control; never on public Wi-Fi or the open internet.
#
# To switch from Profile A to Profile C:
#   1. Comment out the two Profile A lines:
#        # listener 1883 127.0.0.1
#        # allow_anonymous true
#   2. Uncomment the Profile C block below.
#   3. Find the laptop's LAN IP and pass it to every client:
#        ipconfig getifaddr en0
#        python -m node.node_client --node-id node1 --host 192.168.1.50 ...
#
# listener 1883 0.0.0.0
# allow_anonymous true
#
# Profile C deliberately omits acl_file. It is a demo convenience for a
# trusted network, not a security profile. Switch to Profile B (password file
# + ACL) as soon as anyone you do not trust can reach the broker.

# ---------------------------------------------------------------------------
# Optional TLS listener (still commented out; add after the basic LAN works)
# ---------------------------------------------------------------------------
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file /tmp/fedpm25-mosquitto/passwd
# acl_file /tmp/fedpm25-mosquitto/acl
# cafile /tmp/fedpm25-mosquitto/ca.crt
# certfile /tmp/fedpm25-mosquitto/server.crt
# keyfile /tmp/fedpm25-mosquitto/server.key
# require_certificate false
