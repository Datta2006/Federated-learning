# Local-only Stage 2 broker configuration.
# Run from the project root:
#   mkdir -p /tmp/fedpm25-mosquitto
#   mosquitto -c docs/mosquitto.conf -v
#
# This development profile allows anonymous clients on localhost/LAN port 1883.
# Do not expose it to the internet as-is.

# Stage 2 binds loopback only. For phone/LAN nodes in a later stage, change
# to 0.0.0.0 only after enabling password_file/ACL/TLS below.
listener 1883 127.0.0.1
allow_anonymous true
persistence true
persistence_location /tmp/fedpm25-mosquitto/
autosave_interval 30
log_dest stdout
log_type notice
log_type error
log_type warning
connection_messages true

# ---------------------------------------------------------------------------
# Commented production-style authentication / authorization examples
# ---------------------------------------------------------------------------
# To require username/password, create a password file with:
#   mosquitto_passwd -c /tmp/fedpm25-mosquitto/passwd flserver
#   mosquitto_passwd -b /tmp/fedpm25-mosquitto/passwd node1 nodepassword
# Then enable:
# allow_anonymous false
# password_file /tmp/fedpm25-mosquitto/passwd
#
# Example ACL file (acl_file /tmp/fedpm25-mosquitto/acl):
# user flserver
# topic readwrite aq/+/status
# topic readwrite aq/+/health
# topic readwrite aq/+/prediction
# topic readwrite aq/server/#
#
# user node1
# topic write aq/node1/status
# topic write aq/node1/health
# topic write aq/node1/prediction
# topic read aq/server/#
# topic read aq/node1/#
# pattern write aq/%u/#
#
# ---------------------------------------------------------------------------
# Commented TLS listener example
# ---------------------------------------------------------------------------
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file /tmp/fedpm25-mosquitto/passwd
# cafile /tmp/fedpm25-mosquitto/ca.crt
# certfile /tmp/fedpm25-mosquitto/server.crt
# keyfile /tmp/fedpm25-mosquitto/server.key
# require_certificate false
